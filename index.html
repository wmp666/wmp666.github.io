<script>
    // 移除导航点击拦截，使链接正常跳转
    (function() {
        var navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(function(el) {
            var newEl = el.cloneNode(true);
            el.parentNode.replaceChild(newEl, el);
        });
    })();
</script>
