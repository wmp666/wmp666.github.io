<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间显示工具</title>
    <link rel="shortcut icon" href="../avatar.png">
    <link rel="stylesheet" href="../layui/css/layui.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        /* 页面专有样式：仅本页需要的布局微调、大号渐变数字与两个浮动按钮。
           公共骨架（.site-header/.site-body/.page-section/.site-card）来自 ../style.css，不在此重复。 */

        /* 时间卡片在内容区水平+垂直居中 */
        .site-body .time-section {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .time-card.layui-card {
            width: 100%;
            max-width: 720px;
            margin: 0;
        }

        /* 大号时间卡片不参与卡片悬浮动效 */
        .time-card.layui-card:hover {
            transform: none;
            box-shadow: 0 6px 18px var(--shadow);
        }

        .time-card .layui-card-body {
            padding: 48px 32px 40px;
            text-align: center;
        }

        .time-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--primary-blue);
        }

        .time-title .layui-icon {
            font-size: 26px;
        }

        .time-main {
            margin-bottom: 16px;
            font-size: 5rem;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: 4px;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(135deg, var(--primary-blue), var(--blue-dark), var(--blue-light), var(--primary-blue));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 5s ease infinite;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .date-display {
            margin-bottom: 10px;
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--text-light);
        }

        .weekday-display {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-blue);
        }

        .time-note {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
            padding: 10px 18px;
            border-radius: 10px;
            background: rgba(33, 150, 243, 0.1);
        }

        .time-note .layui-icon {
            font-size: 15px;
        }

        /* 浮动按钮：右下全屏 / 左下返回，沿用原 56×56 圆角方块 */
        .float-btn.layui-btn {
            position: fixed;
            bottom: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            padding: 0;
            border-radius: 16px;
            color: var(--text-on-blue);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .float-btn .layui-icon {
            font-size: 22px;
            color: inherit;
        }

        .float-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(33, 150, 243, 0.5);
        }

        .float-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .float-btn-left {
            left: 30px;
        }

        .float-btn-right {
            right: 30px;
        }

        @media (max-width: 768px) {
            .time-main {
                font-size: 3.5rem;
                letter-spacing: 2px;
            }

            .date-display {
                font-size: 1.2rem;
            }

            .weekday-display {
                font-size: 1rem;
            }

            .time-title {
                font-size: 1.3rem;
                margin-bottom: 22px;
            }

            .time-card .layui-card-body {
                padding: 32px 18px 30px;
            }

            .float-btn.layui-btn {
                bottom: 20px;
                width: 50px;
                height: 50px;
                border-radius: 14px;
            }

            .float-btn-left {
                left: 20px;
            }

            .float-btn-right {
                right: 20px;
            }
        }
    </style>
</head>
<body>

<div class="layui-layout layui-layout-admin site-shell">

    <!-- 顶部栏 -->
    <header class="layui-header site-header">
        <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav-main" aria-label="打开菜单">
            <i class="layui-icon layui-icon-spread-left"></i>
        </button>
        <a class="site-logo" href="../index.html">
            <span class="blue-text">wmp666</span><span class="logo-sub"> 时间显示工具</span>
        </a>
        <ul class="layui-nav site-nav-main" id="site-nav-main">
            <li class="layui-nav-item">
                <a href="../index.html"><i class="layui-icon layui-icon-home"></i>个人主页</a>
            </li>
            <li class="layui-nav-item">
                <a href="../page/projects.html"><i class="layui-icon layui-icon-component"></i>小玩意儿</a>
            </li>
            <li class="layui-nav-item layui-this active">
                <a href="../page/webTool.html"><i class="layui-icon layui-icon-util"></i>小工具</a>
            </li>
            <li class="layui-nav-item">
                <a href="../page/showImage.html"><i class="layui-icon layui-icon-picture"></i>美图鉴赏</a>
            </li>
        </ul>
        <ul class="layui-nav site-nav-right" lay-filter="site-nav-right">
            <li class="layui-nav-item">
                <a href="../page/webTool.html" title="返回小工具页面">
                    <i class="layui-icon layui-icon-return"></i> 返回
                </a>
            </li>
        </ul>
    </header>

    <!-- 内容区 -->
    <div class="layui-body site-body">
        <div class="page-section time-section">
            <div class="layui-card site-card time-card">
                <div class="layui-card-body">
                    <h1 class="time-title">
                        <i class="layui-icon layui-icon-time"></i>
                        当前时间
                    </h1>

                    <div class="time-main" id="timeMain">00:00:00</div>
                    <div class="date-display" id="dateDisplay">加载中...</div>
                    <div class="weekday-display" id="weekdayDisplay"></div>

                    <div class="time-note site-warning">
                        <i class="layui-icon layui-icon-tips"></i>
                        <span>显示的时间为系统时间，而非服务器时间</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<a href="../page/webTool.html" class="layui-btn layui-btn-normal float-btn float-btn-left" title="返回小工具页面">
    <i class="layui-icon layui-icon-return"></i>
</a>

<button type="button" class="layui-btn layui-btn-normal float-btn float-btn-right" title="全屏显示" id="full-screen-button">
    <i class="layui-icon layui-icon-screen-full"></i>
</button>

<script src="../layui/layui.js"></script>
<script>
    layui.use(['element', 'layer'], function () {});
</script>
<script>
    function updateTime() {
        const now = new Date();

        // 获取时间
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');

        // 获取日期
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');

        // 获取星期
        const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        const weekday = weekdays[now.getDay()];

        // 更新显示
        document.getElementById('timeMain').textContent = `${hours}:${minutes}:${seconds}`;
        document.getElementById('dateDisplay').textContent = `${year}年${month}月${day}日`;
        document.getElementById('weekdayDisplay').textContent = weekday;
    }

    // 立即更新一次
    updateTime();

    // 每秒更新
    setInterval(updateTime, 1000);


    const html = document.querySelector('html');
    const fullScreenBtn = document.getElementById('full-screen-button');

    // 更新全屏按钮图标
    function updateFullScreenIcon() {
        if (document.fullscreenElement) {
            fullScreenBtn.innerHTML = '<i class="layui-icon layui-icon-screen-restore"></i>';
            fullScreenBtn.title = '退出全屏';
        } else {
            fullScreenBtn.innerHTML = '<i class="layui-icon layui-icon-screen-full"></i>';
            fullScreenBtn.title = '全屏显示';
        }
    }

    // 监听全屏变化事件
    document.addEventListener('fullscreenchange', updateFullScreenIcon);
    document.addEventListener('webkitfullscreenchange', updateFullScreenIcon);
    document.addEventListener('mozfullscreenchange', updateFullScreenIcon);
    document.addEventListener('MSFullscreenChange', updateFullScreenIcon);

    // 点击切换全屏
    fullScreenBtn.onclick = () => {
        if (!document.fullscreenElement) {
            // 进入全屏
            html.requestFullscreen()
                .then(() => {
                    console.log('进入全屏成功');
                })
                .catch((err) => {
                    console.error('进入全屏失败:', err);
                });
        } else {
            // 退出全屏
            document.exitFullscreen()
                .then(() => {
                    console.log('退出全屏成功');
                })
                .catch((err) => {
                    console.error('退出全屏失败:', err);
                });
        }
    }
</script>
</body>
</html>
